global:
  scrape_interval: 5s
  evaluation_interval: 15s

# Recording rules (precomputed queries) and alert rules
rule_files:
  - /etc/prometheus/rules/*.yml

# Where firing alerts are sent
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # A `service` label on each target lets rules and alerts say
  # "order-api" instead of "order-api:8000"
  - job_name: pizza
    static_configs:
      - targets: [order-api:8000]
        labels: { service: order-api }
      - targets: [payment-service:8000]
        labels: { service: payment-service }
      - targets: [kitchen-service:8000]
        labels: { service: kitchen-service }

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels: { service: postgres }

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
        labels: { service: host }

  # Monitor the monitoring too
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: { service: prometheus }

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels: { service: alertmanager }
